version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Install from the monorepo root so workspace deps resolve correctly
            - cd ..
            - rm -f package-lock.json frontend/package-lock.json shared/package-lock.json
            - npm install --no-package-lock
            - cd frontend
        build:
          commands:
            - npm run build
      artifacts:
        # .next/standalone + static assets for SSR (WEB_COMPUTE)
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../node_modules/**/*
          - .next/cache/**/*
